<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Document</title>
  <meta name="description" content="Description">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@5/dist/themes/core.min.css">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@5/dist/themes/addons/vue.min.css">
</head>
<body>
  <div id="app"></div>
  <script>
    const isLocal = ['localhost', '127.0.0.1', '::1'].includes(location.hostname);
    const navbarFile = `${location.origin}${isLocal ? '' : '/docsify-balmis'}/_navbar.md`;
    window.$docsify = {
      name: 'Balmis Docsify',
      repo: '',
      routerMode: 'history',
      alias: {
        '/_navbar.md': navbarFile,
        '/.*/_navbar.md': navbarFile
      },
      loadNavbar: true,
      loadSidebar: true,
      subMaxLevel: 2,
      auto2top: true,
      plugins: [
        function (hook) {
          const rewriteLocalLinks = () => {
            if (!isLocal) return;
            document.querySelectorAll('a[href^="/docsify-balmis/"]').forEach(link => {
              link.setAttribute('href', link.getAttribute('href').replace(/^\/docsify-balmis/, '') || '/');
            });
          };
          if (isLocal) {
            new MutationObserver(rewriteLocalLinks).observe(document.body, { childList: true, subtree: true });
          }
          const fit = () => {
            rewriteLocalLinks();
            const sb = document.querySelector('.sidebar');
            if (!sb) return;
            const rem = parseFloat(getComputedStyle(document.documentElement).fontSize);
            sb.style.width = 'max-content';
            const w = Math.min(Math.max(sb.offsetWidth + 8, 12 * rem), 24 * rem);
            sb.style.width = '';
            document.documentElement.style.setProperty('--sidebar-width', w + 'px');
          };
          hook.doneEach(fit);
        }
      ]
    }
  </script>
  <!-- Docsify resource -->
  <script src="//cdn.jsdelivr.net/npm/docsify@5"></script>
</body>
</html>

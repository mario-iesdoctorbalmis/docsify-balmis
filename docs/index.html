<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Document</title>
  <meta name="description" content="Description">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@5/dist/themes/core.min.css">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@5/dist/themes/addons/vue.min.css">
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'Balmis Docsify',
      repo: '',
      basePath: '/docsify-balmis/',
      routerMode: 'history',
      alias: {
        '/.*/_navbar.md': '/_navbar.md'
      },
      loadNavbar: true,
      loadSidebar: true,
      subMaxLevel: 2,
      auto2top: true,
      plugins: [
        function (hook) {
          // Ajusta el ancho del sidebar a su contenido (entre 12rem y 24rem)
          const fit = () => {
            const sb = document.querySelector('.sidebar');
            if (!sb) return;
            const rem = parseFloat(getComputedStyle(document.documentElement).fontSize);
            sb.style.width = 'max-content';
            const w = Math.min(Math.max(sb.offsetWidth + 8, 12 * rem), 24 * rem);
            sb.style.width = '';
            document.documentElement.style.setProperty('--sidebar-width', w + 'px');
          };
          hook.doneEach(fit);
        }
      ]
    }
  </script>
  <!-- Docsify resource -->
  <script src="//cdn.jsdelivr.net/npm/docsify@5"></script>
</body>
</html>
